# Build, test (emulated) and publish a BF4 VR release. Tag bf4-vX.Y.Z for a release,
# bf4-vX.Y.Z-rcN (or any suffix) for a pre-release. Hotfixes are patch bumps: bf4-v0.1.1.
# The bf4- prefix keeps BF4 releases apart from other games in this repository; the BF4
# launcher only installs releases with it.
name: bf4-release
on:
  push:
    tags: ["bf4-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022  # same image as build.yml (VS 2022 generator)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, as build.yml
        with:
          persist-credentials: false
      - name: Khronos OpenXR loader 1.1.61 (pinned by SHA-256, see THIRD_PARTY_NOTICES.md)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\openxr_loader.zip"
          Invoke-WebRequest "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-1.1.61/openxr_loader_windows-1.1.61.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\openxr_loader"
          $dll = Get-ChildItem "$env:RUNNER_TEMP\openxr_loader" -Recurse -Filter openxr_loader.dll | Where-Object { $_.FullName -match '[\\/]x64[\\/]bin[\\/]' } | Select-Object -First 1
          if (-not $dll) { throw "x64/bin/openxr_loader.dll not found in the Khronos archive (the UWP build is not used)" }
          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "a69729a3348bc4dcb9be126a49d594074e477be7312f65180b0d082bf100fa5f") { throw "loader hash $hash does not match the pinned loader" }
          New-Item -ItemType Directory -Force runtime/openxr/win64 | Out-Null
          Copy-Item $dll.FullName runtime/openxr/win64/openxr_loader.dll
      - name: Configure (x64, Release only)
        run: cmake -S . -B build/x64 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DFVR_BF4=ON
      - name: Build BF4 targets only
        run: cmake --build build/x64 --config Release --target FrostbiteVR.Bf4 Bf4DxgiProxy Bf4NvapiShim FvrXrHost Bf4CoreTests Bf4EmuHost -- /m
      - name: Emulated tests (no game, WARP, no headset)
        run: ctest --test-dir build/x64 -C Release -R "^Bf4" --output-on-failure
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, as build.yml
        with: { python-version: "3.13" }
      - name: Launcher tests
        run: python -B -m unittest discover -s launcher/tests -p "test_*.py"
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^bf4-v', ''
          $ch = if ($v.Contains("-")) { "prerelease" } else { "stable" }
          python tools/release/make_release.py --build build/x64/Release --version $v --channel $ch --out dist --require-xr-host
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $v = "${{ github.ref_name }}"
          $pre = if ($v.Contains("-")) { "--prerelease" } else { "" }
          gh release create $v dist/*.zip dist/*.manifest.json --title "BF4 VR $v" --generate-notes $pre
