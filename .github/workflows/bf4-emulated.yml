# Portable checks on every push/PR (Linux runner): the launcher's update/rollback, emulated
# VR session and release contract. The BF4 C++ suites (Bf4Core, Bf4Emulated) build and run
# on Windows in build.yml, where the BF4 adapter is part of the default CMake build.
name: bf4-emulated
on: [push, pull_request]
permissions:
  contents: read
jobs:
  emulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, as build.yml
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, as build.yml
        with: { python-version: "3.13" }
      - run: bash tools/emulated/run_all.sh
